name: Maven CI

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the Maven artifact after all checks pass
        required: false
        type: boolean
        default: true
      sonar_host_url:
        description: SonarQube Server URL; leave empty for SonarQube Cloud
        required: false
        type: string
        default: ''
      sonar_organization:
        description: SonarQube Cloud organization key; leave empty for SonarQube Server
        required: false
        type: string
        default: ''
      sonar_project_key:
        description: Sonar project key; defaults to owner_repository
        required: false
        type: string
        default: ''
    secrets:
      PACKAGES_TOKEN:
        required: false
      SONAR_TOKEN:
        description: Token with Execute Analysis permission
        required: false
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: maven-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  packages: write

env:
  JAVA_VERSION: '17'

jobs:
  release-validation:
    name: Validate release coordinates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    steps:
      - name: Skip validation outside release tags
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Immutable release validation only applies to v* tags."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN
      - name: Purge stale hn.shadowcore cache entries
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: rm -rf ~/.m2/repository/hn/shadowcore
      - name: Reject mutable or snapshot-based releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(mvn -B -ntp -U -Dstyle.color=never help:evaluate \
            -Dexpression=project.version -q -DforceStdout | tr -d '\r')"
          parent_version="$(mvn -B -ntp -U -Dstyle.color=never help:evaluate \
            -Dexpression=project.parent.version -q -DforceStdout | tr -d '\r')"

          if [[ "${project_version}" != "${release_version}" ]]; then
            echo "Release tag v${release_version} must match Maven project version ${project_version}."
            exit 1
          fi
          if [[ "${project_version}" == *-SNAPSHOT ]]; then
            echo "Release project version cannot be a SNAPSHOT: ${project_version}."
            exit 1
          fi
          if [[ "${parent_version}" == *-SNAPSHOT ]]; then
            echo "Release parent version cannot be a SNAPSHOT: ${parent_version}."
            exit 1
          fi

          mkdir -p target
          mvn -B -ntp -U dependency:list \
            -DincludeGroupIds=hn.alturaforge \
            -DoutputFile=target/internal-dependencies.txt \
            -DappendOutput=false
          if grep -q -- '-SNAPSHOT' target/internal-dependencies.txt; then
            echo "Release depends on mutable MercadoX SNAPSHOT artifacts:"
            grep -- '-SNAPSHOT' target/internal-dependencies.txt
            exit 1
          fi

  unit-tests:
    name: Unit tests
    needs: release-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN
      - name: Purge stale hn.shadowcore cache entries
        run: rm -rf ~/.m2/repository/hn/shadowcore
      - name: Run unit tests
        run: >-
          mvn -B -ntp -U
          -Dtest='!*IntTest,!*IntegrationTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    needs: release-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN
      - name: Purge stale hn.shadowcore cache entries
        run: rm -rf ~/.m2/repository/hn/shadowcore
      - name: Run integration tests
        run: >-
          mvn -B -ntp -U
          -Dtest='*IntTest,*IntegrationTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Upload integration-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  quality:
    name: Coverage and Sonar analysis
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ inputs.sonar_host_url || vars.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ inputs.sonar_organization || vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key || vars.SONAR_PROJECT_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      ANALYSIS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN
      - name: Purge stale hn.shadowcore cache entries
        run: rm -rf ~/.m2/repository/hn/shadowcore
      - name: Generate JaCoCo coverage report
        run: >-
          mvn -B -ntp -U clean
          org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent
          test
          org.jacoco:jacoco-maven-plugin:0.8.13:report
      - name: Upload coverage report
        # Parent/BOM repositories have no Java source and legitimately produce no JaCoCo report.
        # Java projects still fail here if their expected report is missing.
        if: ${{ always() && hashFiles('src/main/java/**/*.java') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: error
      - name: Analyze with SonarQube
        if: ${{ env.SONAR_TOKEN != '' && hashFiles('src/main/java/**/*.java') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          project_key="${SONAR_PROJECT_KEY:-${GITHUB_REPOSITORY/\//_}}"
          sonar_args=(
            "-Dsonar.projectKey=${project_key}"
            "-Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml"
          )
          if [[ -n "${SONAR_HOST_URL}" ]]; then
            sonar_args+=("-Dsonar.host.url=${SONAR_HOST_URL}")
          fi
          if [[ -n "${SONAR_ORGANIZATION}" ]]; then
            sonar_args+=("-Dsonar.organization=${SONAR_ORGANIZATION}")
          fi
          if [[ -n "${SONAR_HOST_URL}" && "${SONAR_HOST_URL}" != "https://sonarcloud.io" ]]; then
            sonar_args+=("-Dsonar.qualitygate.wait=true")
          else
            sonar_args+=("-Dsonar.qualitygate.wait=false")
          fi

          set +e
          mvn -B -ntp -U org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            "${sonar_args[@]}" 2>&1 | tee target/sonar-scanner.log
          scanner_status="${PIPESTATUS[0]}"
          set -e
          if [[ "${scanner_status}" -ne 0 ]]; then
            scanner_error="$(grep -E '^\[ERROR\]|^ERROR ' target/sonar-scanner.log | tail -1 || true)"
            echo "::error title=Sonar scanner failed::${scanner_error:-See the Analyze with SonarQube step log.}"
            exit "${scanner_status}"
          fi
      - name: Wait for SonarCloud quality gate
        if: ${{ env.SONAR_TOKEN != '' && hashFiles('src/main/java/**/*.java') != '' && (env.SONAR_HOST_URL == '' || env.SONAR_HOST_URL == 'https://sonarcloud.io') }}
        shell: bash
        run: |
          set -euo pipefail
          checks_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${ANALYSIS_SHA}/check-runs?per_page=100"
          for attempt in {1..60}; do
            if ! checks_json="$(curl --fail --silent --show-error \
                    --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                    --header "Accept: application/vnd.github+json" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    "${checks_url}")"; then
              echo "::error title=SonarCloud quality gate failed::Could not read GitHub check status."
              exit 1
            fi

            check_count="$(jq '[.check_runs[] | select(.name == "SonarCloud Code Analysis")] | length' <<< "${checks_json}")"
            pending_count="$(jq '[.check_runs[] | select(.name == "SonarCloud Code Analysis" and .status != "completed")] | length' <<< "${checks_json}")"
            if [[ "${check_count}" -gt 0 && "${pending_count}" -eq 0 ]]; then
              failed_checks="$(jq '[.check_runs[] | select(.name == "SonarCloud Code Analysis" and .conclusion != "success")] | length' <<< "${checks_json}")"
              if [[ "${failed_checks}" -eq 0 ]]; then
                echo "SonarCloud quality gate passed for ${ANALYSIS_SHA}."
                exit 0
              fi
              check_summary="$(jq -r '[.check_runs[] | select(.name == "SonarCloud Code Analysis") | "\(.conclusion): \(.output.title // "No details")"] | join(", ")' <<< "${checks_json}")"
              echo "::error title=SonarCloud quality gate failed::${check_summary}"
              exit 1
            fi
            sleep 2
          done
          echo "::error title=SonarCloud quality gate timed out::No completed SonarCloud check was available within 120 seconds."
          exit 1
      - name: Explain skipped Sonar analysis
        if: ${{ env.SONAR_TOKEN == '' && hashFiles('src/main/java/**/*.java') != '' }}
        run: echo "JaCoCo coverage generated; Sonar analysis skipped because SONAR_TOKEN is not configured."
      - name: Explain skipped code analysis for parent POM
        if: ${{ hashFiles('src/main/java/**/*.java') == '' }}
        run: echo "Coverage and Sonar analysis are not applicable because this repository has no Java sources."

  package:
    name: Package
    needs: [unit-tests, integration-tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN
      - name: Purge stale hn.shadowcore cache entries
        run: rm -rf ~/.m2/repository/hn/shadowcore
      - name: Build package
        run: mvn -B -ntp -U package -DskipTests
      - name: Publish Maven artifact
        if: >-
          (inputs.publish == true || inputs.publish == '') && github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(mvn -B -ntp -U -Dstyle.color=never help:evaluate \
            -Dexpression=project.version -q -DforceStdout | tr -d '\r')"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            mvn -B -ntp -U deploy -DskipTests
          elif [[ "${project_version}" == *-SNAPSHOT ]]; then
            mvn -B -ntp -U deploy -DskipTests
          else
            echo "Not republishing immutable version ${project_version} from a branch."
          fi
